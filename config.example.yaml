port: 12190
firewall: iptables  # iptables is default, can also use nftables

# Logging
log: stdout          # or /var/log/roco.log
log_level: info      # or debug

# Encrypt roco-to-roco links with mutual TLS (see README "TLS").
# Create certificates with `roco tls init-ca` / `roco tls issue <node>`.
tls:
  mode: off            # off | optional | required
  # ca:   /etc/roco/tls/ca.crt
  # cert: /etc/roco/tls/node.crt
  # key:  /etc/roco/tls/node.key
  # allowed_peers: [hostB, C]   # only accept these nodes (certificate names)

relays:
  - targets: ["serverC", "208.224.251.1", "192.168.30.0/24"]
    chain: [hostB]

  # Multi-hop: A -> B -> C -> D -> E -> F
  # resolve_dns: true passes the hostname "F" through the chain so each hop
  # resolves it with its own /etc/hosts or DNS.
  - targets: ["F"]
    chain: [B, C, D, E]
    resolve_dns: true
